<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'Consolas','Courier New',monospace">
  <defs>
    <filter id="scan">
      <feTurbulence type="fractalNoise" baseFrequency="0 0.8" numOctaves="1" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="lines"/>
      <feBlend in="SourceGraphic" in2="lines" mode="multiply"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="panelClip"><rect x="0" y="0" width="960" height="580"/></clipPath>
  </defs>

  <!-- Deep navy background -->
  <rect width="960" height="580" fill="#0B1120"/>
  <!-- Subtle grid overlay -->
  <g opacity="0.06" stroke="#00D4FF" stroke-width="0.5">
    <line x1="0" y1="0" x2="960" y2="0" repeatCount="58"/>
    <!-- horizontal scanlines -->
    <rect x="0" y="0" width="960" height="580" fill="none" stroke="none"/>
  </g>
  <g opacity="0.04">
    <line x1="96" y1="0" x2="96" y2="580" stroke="#1E3A5F" stroke-width="0.5"/>
    <line x1="192" y1="0" x2="192" y2="580" stroke="#1E3A5F" stroke-width="0.5"/>
    <line x1="288" y1="0" x2="288" y2="580" stroke="#1E3A5F" stroke-width="0.5"/>
    <line x1="384" y1="0" x2="384" y2="580" stroke="#1E3A5F" stroke-width="0.5"/>
    <line x1="480" y1="0" x2="480" y2="580" stroke="#1E3A5F" stroke-width="0.5"/>
    <line x1="576" y1="0" x2="576" y2="580" stroke="#1E3A5F" stroke-width="0.5"/>
    <line x1="672" y1="0" x2="672" y2="580" stroke="#1E3A5F" stroke-width="0.5"/>
    <line x1="768" y1="0" x2="768" y2="580" stroke="#1E3A5F" stroke-width="0.5"/>
    <line x1="864" y1="0" x2="864" y2="580" stroke="#1E3A5F" stroke-width="0.5"/>
    <line x1="0" y1="58" x2="960" y2="58" stroke="#1E3A5F" stroke-width="0.5"/>
    <line x1="0" y1="116" x2="960" y2="116" stroke="#1E3A5F" stroke-width="0.5"/>
    <line x1="0" y1="174" x2="960" y2="174" stroke="#1E3A5F" stroke-width="0.5"/>
    <line x1="0" y1="232" x2="960" y2="232" stroke="#1E3A5F" stroke-width="0.5"/>
    <line x1="0" y1="290" x2="960" y2="290" stroke="#1E3A5F" stroke-width="0.5"/>
    <line x1="0" y1="348" x2="960" y2="348" stroke="#1E3A5F" stroke-width="0.5"/>
    <line x1="0" y1="406" x2="960" y2="406" stroke="#1E3A5F" stroke-width="0.5"/>
    <line x1="0" y1="464" x2="960" y2="464" stroke="#1E3A5F" stroke-width="0.5"/>
    <line x1="0" y1="522" x2="960" y2="522" stroke="#1E3A5F" stroke-width="0.5"/>
  </g>

  <!-- Horizontal scanlines (CRT effect) -->
  <g opacity="0.03">
    <rect x="0" y="0" width="960" height="1" fill="#000" y="2"/>
    <rect x="0" y="4" width="960" height="1" fill="#000"/>
    <rect x="0" y="8" width="960" height="1" fill="#000"/>
  </g>

  <!-- Top bar -->
  <rect x="0" y="0" width="960" height="3" fill="#FFB800" opacity="0.6"/>
  <text x="20" y="22" fill="#FFB800" font-size="11" font-weight="bold" letter-spacing="3" opacity="0.9">GLOVE MODEL ARCHITECTURE</text>
  <text x="940" y="22" fill="#4A6080" font-size="9" text-anchor="end">SYS://GLOVE/MODEL</text>

  <!-- Status beacon top-right -->
  <circle cx="880" cy="17" r="3" fill="#FFB800" opacity="0.8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="870" y="20" fill="#FFB800" font-size="8" text-anchor="end" opacity="0.6">ACTIVE</text>

  <!-- === W MATRIX PANEL === -->
  <g>
    <rect x="30" y="50" width="200" height="240" fill="#111827" stroke="#1E3A5F" stroke-width="1"/>
    <!-- Chamfered top-left corner accent -->
    <line x1="30" y1="50" x2="70" y2="50" stroke="#FFB800" stroke-width="1.5" opacity="0.7"/>
    <line x1="30" y1="50" x2="30" y2="90" stroke="#FFB800" stroke-width="1.5" opacity="0.7"/>
    <!-- Label -->
    <text x="40" y="68" fill="#FFB800" font-size="13" font-weight="bold" letter-spacing="2">W</text>
    <text x="40" y="82" fill="#4A6080" font-size="8">WORD VECTORS</text>
    <!-- Shape annotation -->
    <text x="130" y="68" fill="#00D4FF" font-size="9" opacity="0.7">[V × 300]</text>
    <!-- Matrix grid visualization -->
    <g opacity="0.2" stroke="#FFB800" stroke-width="0.5">
      <line x1="50" y1="100" x2="210" y2="100"/>
      <line x1="50" y1="125" x2="210" y2="125"/>
      <line x1="50" y1="150" x2="210" y2="150"/>
      <line x1="50" y1="175" x2="210" y2="175"/>
      <line x1="50" y1="200" x2="210" y2="200"/>
      <line x1="50" y1="225" x2="210" y2="225"/>
      <line x1="50" y1="250" x2="210" y2="250"/>
      <line x1="90" y1="95" x2="90" y2="260"/>
      <line x1="130" y1="95" x2="130" y2="260"/>
      <line x1="170" y1="95" x2="170" y2="260"/>
    </g>
    <!-- Highlighted row w_i -->
    <rect x="50" y="125" width="160" height="25" fill="#FFB800" opacity="0.08" stroke="#FFB800" stroke-width="0.5" stroke-opacity="0.3">
      <animate attributeName="fill-opacity" values="0.04;0.12;0.04" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="55" y="142" fill="#FFB800" font-size="10" font-weight="bold" opacity="0.9">w_i</text>
    <!-- Data cells in row -->
    <text x="95" y="142" fill="#8BA3C7" font-size="7" opacity="0.5">0.23</text>
    <text x="135" y="142" fill="#8BA3C7" font-size="7" opacity="0.5">-0.41</text>
    <text x="175" y="142" fill="#8BA3C7" font-size="7" opacity="0.5">0.07</text>
    <!-- Dimension label -->
    <text x="130" y="278" fill="#4A6080" font-size="7" text-anchor="middle">EMBEDDING_DIM = 300</text>
  </g>

  <!-- === b VECTOR PANEL === -->
  <g>
    <rect x="30" y="310" width="200" height="60" fill="#111827" stroke="#1E3A5F" stroke-width="1"/>
    <line x1="30" y1="310" x2="70" y2="310" stroke="#FF4757" stroke-width="1.5" opacity="0.6"/>
    <line x1="30" y1="310" x2="30" y2="340" stroke="#FF4757" stroke-width="1.5" opacity="0.6"/>
    <text x="40" y="332" fill="#FF4757" font-size="12" font-weight="bold" letter-spacing="2">b</text>
    <text x="60" y="332" fill="#4A6080" font-size="8">WORD BIAS</text>
    <text x="170" y="332" fill="#00D4FF" font-size="9" opacity="0.7">[V × 1]</text>
    <!-- Small bar chart for bias values -->
    <g opacity="0.3" fill="#FF4757">
      <rect x="45" y="350" width="6" height="12" rx="1"/>
      <rect x="55" y="346" width="6" height="16" rx="1"/>
      <rect x="65" y="352" width="6" height="10" rx="1"/>
      <rect x="75" y="344" width="6" height="18" rx="1"/>
      <rect x="85" y="350" width="6" height="12" rx="1"/>
      <rect x="95" y="348" width="6" height="14" rx="1"/>
    </g>
  </g>

  <!-- === W_tilde MATRIX PANEL === -->
  <g>
    <rect x="730" y="50" width="200" height="240" fill="#111827" stroke="#1E3A5F" stroke-width="1"/>
    <line x1="930" y1="50" x2="890" y2="50" stroke="#00D4FF" stroke-width="1.5" opacity="0.7"/>
    <line x1="930" y1="50" x2="930" y2="90" stroke="#00D4FF" stroke-width="1.5" opacity="0.7"/>
    <text x="740" y="68" fill="#00D4FF" font-size="13" font-weight="bold" letter-spacing="2">W̃</text>
    <text x="740" y="82" fill="#4A6080" font-size="8">CONTEXT VECTORS</text>
    <text x="830" y="68" fill="#FFB800" font-size="9" opacity="0.7">[V × 300]</text>
    <!-- Matrix grid -->
    <g opacity="0.2" stroke="#00D4FF" stroke-width="0.5">
      <line x1="750" y1="100" x2="910" y2="100"/>
      <line x1="750" y1="125" x2="910" y2="125"/>
      <line x1="750" y1="150" x2="910" y2="150"/>
      <line x1="750" y1="175" x2="910" y2="175"/>
      <line x1="750" y1="200" x2="910" y2="200"/>
      <line x1="750" y1="225" x2="910" y2="225"/>
      <line x1="750" y1="250" x2="910" y2="250"/>
      <line x1="790" y1="95" x2="790" y2="260"/>
      <line x1="830" y1="95" x2="830" y2="260"/>
      <line x1="870" y1="95" x2="870" y2="260"/>
    </g>
    <!-- Highlighted row w_tilde_j -->
    <rect x="750" y="125" width="160" height="25" fill="#00D4FF" opacity="0.08" stroke="#00D4FF" stroke-width="0.5" stroke-opacity="0.3">
      <animate attributeName="fill-opacity" values="0.04;0.12;0.04" dur="3s" repeatCount="indefinite" begin="1s"/>
    </rect>
    <text x="755" y="142" fill="#00D4FF" font-size="10" font-weight="bold" opacity="0.9">w̃_j</text>
    <text x="795" y="142" fill="#8BA3C7" font-size="7" opacity="0.5">-0.15</text>
    <text x="835" y="142" fill="#8BA3C7" font-size="7" opacity="0.5">0.33</text>
    <text x="875" y="142" fill="#8BA3C7" font-size="7" opacity="0.5">-0.08</text>
    <text x="830" y="278" fill="#4A6080" font-size="7" text-anchor="middle">EMBEDDING_DIM = 300</text>
  </g>

  <!-- === b_tilde VECTOR PANEL === -->
  <g>
    <rect x="730" y="310" width="200" height="60" fill="#111827" stroke="#1E3A5F" stroke-width="1"/>
    <line x1="930" y1="310" x2="890" y2="310" stroke="#26DE81" stroke-width="1.5" opacity="0.6"/>
    <line x1="930" y1="310" x2="930" y2="340" stroke="#26DE81" stroke-width="1.5" opacity="0.6"/>
    <text x="740" y="332" fill="#26DE81" font-size="12" font-weight="bold" letter-spacing="2">b̃</text>
    <text x="760" y="332" fill="#4A6080" font-size="8">CONTEXT BIAS</text>
    <text x="870" y="332" fill="#FFB800" font-size="9" opacity="0.7">[V × 1]</text>
    <g opacity="0.3" fill="#26DE81">
      <rect x="745" y="350" width="6" height="10" rx="1"/>
      <rect x="755" y="348" width="6" height="12" rx="1"/>
      <rect x="765" y="352" width="6" height="8" rx="1"/>
      <rect x="775" y="346" width="6" height="14" rx="1"/>
      <rect x="785" y="350" width="6" height="10" rx="1"/>
    </g>
  </g>

  <!-- === CENTRAL COMPUTATION: DOT PRODUCT === -->
  <g>
    <rect x="390" y="80" width="180" height="80" fill="#111827" stroke="#1E3A5F" stroke-width="1"/>
    <line x1="390" y1="80" x2="430" y2="80" stroke="#FFB800" stroke-width="1.5" opacity="0.6"/>
    <line x1="390" y1="80" x2="390" y2="110" stroke="#FFB800" stroke-width="1.5" opacity="0.6"/>
    <line x1="570" y1="160" x2="530" y2="160" stroke="#00D4FF" stroke-width="1.5" opacity="0.6"/>
    <line x1="570" y1="160" x2="570" y2="130" stroke="#00D4FF" stroke-width="1.5" opacity="0.6"/>
    <text x="480" y="102" text-anchor="middle" fill="#FFB800" font-size="11" font-weight="bold" letter-spacing="1">DOT PRODUCT</text>
    <text x="480" y="120" text-anchor="middle" fill="#E8F0FE" font-size="12">w_i^T · w̃_j</text>
    <text x="480" y="148" text-anchor="middle" fill="#4A6080" font-size="8">SCALAR OUTPUT</text>
  </g>

  <!-- Data flow: W → dot -->
  <line x1="230" y1="120" x2="388" y2="120" stroke="#FFB800" stroke-width="1" opacity="0.5"/>
  <circle r="2" fill="#FFB800" opacity="0.8">
    <animateMotion dur="2s" repeatCount="indefinite" path="M230,120 L388,120"/>
  </circle>

  <!-- Data flow: W_tilde → dot -->
  <line x1="730" y1="120" x2="572" y2="120" stroke="#00D4FF" stroke-width="1" opacity="0.5"/>
  <circle r="2" fill="#00D4FF" opacity="0.8">
    <animateMotion dur="2s" repeatCount="indefinite" path="M730,120 L572,120"/>
  </circle>

  <!-- === ADD BIAS NODE === -->
  <g>
    <rect x="390" y="185" width="180" height="55" fill="#111827" stroke="#1E3A5F" stroke-width="1"/>
    <line x1="390" y1="185" x2="430" y2="185" stroke="#FF4757" stroke-width="1.5" opacity="0.5"/>
    <text x="480" y="205" text-anchor="middle" fill="#E8F0FE" font-size="10" letter-spacing="1">+ b_i + b̃_j</text>
    <text x="480" y="228" text-anchor="middle" fill="#4A6080" font-size="8">ADD BIAS TERMS</text>
  </g>
  <line x1="480" y1="162" x2="480" y2="183" stroke="#8BA3C7" stroke-width="1" opacity="0.3"/>

  <!-- Bias flow arrows (curved paths) -->
  <path d="M130,310 Q130,260 390,210" fill="none" stroke="#FF4757" stroke-width="0.8" opacity="0.3" stroke-dasharray="4 3"/>
  <circle r="1.5" fill="#FF4757" opacity="0.6">
    <animateMotion dur="3s" repeatCount="indefinite" path="M130,310 Q130,260 390,210"/>
  </circle>
  <path d="M830,310 Q830,260 570,210" fill="none" stroke="#26DE81" stroke-width="0.8" opacity="0.3" stroke-dasharray="4 3"/>
  <circle r="1.5" fill="#26DE81" opacity="0.6">
    <animateMotion dur="3s" repeatCount="indefinite" path="M830,310 Q830,260 570,210"/>
  </circle>

  <!-- === SUBTRACT LOG(X_ij) === -->
  <g>
    <rect x="390" y="265" width="180" height="55" fill="#111827" stroke="#1E3A5F" stroke-width="1"/>
    <line x1="570" y1="265" x2="530" y2="265" stroke="#9F43FF" stroke-width="1.5" opacity="0.5"/>
    <text x="480" y="287" text-anchor="middle" fill="#9F43FF" font-size="11" font-weight="bold" letter-spacing="1">− log(X_ij)</text>
    <text x="480" y="308" text-anchor="middle" fill="#4A6080" font-size="8">TARGET: LOG CO-OCCURRENCE</text>
  </g>
  <line x1="480" y1="242" x2="480" y2="263" stroke="#8BA3C7" stroke-width="1" opacity="0.3"/>

  <!-- === DIFF RESULT === -->
  <g>
    <rect x="350" y="345" width="260" height="40" fill="#111827" stroke="#1E3A5F" stroke-width="1"/>
    <text x="480" y="370" text-anchor="middle" fill="#8BA3C7" font-size="9" letter-spacing="0.5">DIFF = w_i^T·w̃_j + b_i + b̃_j − log(X_ij)</text>
  </g>
  <line x1="480" y1="322" x2="480" y2="343" stroke="#8BA3C7" stroke-width="1" opacity="0.3"/>

  <!-- === WEIGHTED COST === -->
  <g>
    <rect x="300" y="410" width="360" height="65" fill="#111827" stroke="#FFB800" stroke-width="1" opacity="0.9"/>
    <line x1="300" y1="410" x2="340" y2="410" stroke="#FFB800" stroke-width="2" opacity="0.8"/>
    <line x1="660" y1="475" x2="620" y2="475" stroke="#FFB800" stroke-width="2" opacity="0.8"/>
    <text x="480" y="432" text-anchor="middle" fill="#FFB800" font-size="13" font-weight="bold" letter-spacing="2">COST J</text>
    <text x="480" y="452" text-anchor="middle" fill="#E8F0FE" font-size="10">J = Σ f(X_ij) × DIFF²</text>
    <text x="480" y="468" text-anchor="middle" fill="#4A6080" font-size="8">WEIGHTED LEAST SQUARES OVER NONZERO ENTRIES</text>
  </g>
  <line x1="480" y1="387" x2="480" y2="408" stroke="#FFB800" stroke-width="1" opacity="0.5"/>
  <text x="490" y="400" fill="#FFB800" font-size="7" opacity="0.5">SQUARE × f()</text>

  <!-- === FINAL VECTORS NOTE (bottom) === -->
  <g>
    <rect x="30" y="500" width="280" height="60" fill="#111827" stroke="#1E3A5F" stroke-width="1"/>
    <line x1="30" y1="500" x2="70" y2="500" stroke="#00D4FF" stroke-width="1.5" opacity="0.6"/>
    <text x="40" y="520" fill="#00D4FF" font-size="10" font-weight="bold" letter-spacing="2">FINAL VECTORS</text>
    <text x="40" y="540" fill="#FFB800" font-size="14" font-weight="bold">W + W̃</text>
    <text x="120" y="540" fill="#4A6080" font-size="9">(V × 300) + (V × 300) → V × 300</text>
    <text x="40" y="554" fill="#4A6080" font-size="7">SUM, NOT CONCATENATION</text>
  </g>

  <!-- Bottom status bar -->
  <rect x="0" y="575" width="960" height="5" fill="#111827"/>
  <rect x="0" y="575" width="960" height="1" fill="#1E3A5F" opacity="0.5"/>
  <text x="20" y="572" fill="#4A6080" font-size="7">EMNLP 2014 · PENNINGTON, SOCHER &amp; MANNING</text>
  <text x="940" y="572" fill="#4A6080" font-size="7" text-anchor="end">α=0.75 · x_max=100 · dim=300</text>

  <!-- Gargantua accretion disk line (subtle horizontal light streak across center) -->
  <line x1="0" y1="400" x2="960" y2="400" stroke="#FFB800" stroke-width="0.5" opacity="0.08"/>
</svg>