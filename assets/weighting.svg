<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'Consolas','Courier New',monospace">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="580" fill="#0B1120"/>
  <!-- Grid -->
  <g opacity="0.04" stroke="#1E3A5F" stroke-width="0.5">
    <line x1="120" y1="0" x2="120" y2="580"/>
    <line x1="216" y1="0" x2="216" y2="580"/>
    <line x1="312" y1="0" x2="312" y2="580"/>
    <line x1="408" y1="0" x2="408" y2="580"/>
    <line x1="504" y1="0" x2="504" y2="580"/>
    <line x1="600" y1="0" x2="600" y2="580"/>
    <line x1="696" y1="0" x2="696" y2="580"/>
    <line x1="792" y1="0" x2="792" y2="580"/>
    <line x1="888" y1="0" x2="888" y2="580"/>
    <line x1="0" y1="100" x2="960" y2="100"/>
    <line x1="0" y1="175" x2="960" y2="175"/>
    <line x1="0" y1="250" x2="960" y2="250"/>
    <line x1="0" y1="325" x2="960" y2="325"/>
    <line x1="0" y1="400" x2="960" y2="400"/>
    <line x1="0" y1="475" x2="960" y2="475"/>
  </g>

  <!-- Top bar -->
  <rect x="0" y="0" width="960" height="3" fill="#FFB800" opacity="0.6"/>
  <text x="20" y="22" fill="#FFB800" font-size="11" font-weight="bold" letter-spacing="3" opacity="0.9">WEIGHTING FUNCTION f(x)</text>
  <text x="940" y="22" fill="#4A6080" font-size="9" text-anchor="end">SYS://GLOVE/WEIGHTING</text>
  <circle cx="880" cy="17" r="3" fill="#FFB800" opacity="0.8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Plot panel -->
  <rect x="90" y="50" width="780" height="400" fill="#111827" stroke="#1E3A5F" stroke-width="1"/>
  <line x1="90" y1="50" x2="130" y2="50" stroke="#FFB800" stroke-width="1.5" opacity="0.6"/>
  <line x1="90" y1="50" x2="90" y2="90" stroke="#FFB800" stroke-width="1.5" opacity="0.6"/>

  <!-- Axes -->
  <line x1="130" y1="60" x2="130" y2="420" stroke="#8BA3C7" stroke-width="1" opacity="0.4"/>
  <line x1="130" y1="420" x2="840" y2="420" stroke="#8BA3C7" stroke-width="1" opacity="0.4"/>

  <!-- Y-axis ticks and labels -->
  <g fill="#4A6080" font-size="8" text-anchor="end">
    <text x="125" y="423">0</text>
    <line x1="128" y1="420" x2="132" y2="420" stroke="#8BA3C7" stroke-width="0.5"/>
    <text x="125" y="330">0.25</text>
    <line x1="128" y1="327" x2="132" y2="327" stroke="#8BA3C7" stroke-width="0.5"/>
    <text x="125" y="237">0.50</text>
    <line x1="128" y1="234" x2="132" y2="234" stroke="#8BA3C7" stroke-width="0.5"/>
    <text x="125" y="144">0.75</text>
    <line x1="128" y1="141" x2="132" y2="141" stroke="#8BA3C7" stroke-width="0.5"/>
    <text x="125" y="61">1.00</text>
    <line x1="128" y1="60" x2="132" y2="60" stroke="#8BA3C7" stroke-width="0.5"/>
  </g>

  <!-- X-axis ticks and labels -->
  <g fill="#4A6080" font-size="8" text-anchor="middle">
    <text x="130" y="435">0</text>
    <text x="272" y="435">25</text>
    <text x="414" y="435">50</text>
    <text x="556" y="435">75</text>
    <text x="698" y="435">100</text>
    <text x="840" y="435">125</text>
  </g>

  <!-- Axis labels -->
  <text x="485" y="458" text-anchor="middle" fill="#8BA3C7" font-size="9" letter-spacing="1">x — CO-OCCURRENCE COUNT</text>
  <text x="60" y="240" text-anchor="middle" fill="#8BA3C7" font-size="9" letter-spacing="1" transform="rotate(-90 60 240)">f(x)</text>

  <!-- x_max vertical marker -->
  <line x1="698" y1="60" x2="698" y2="420" stroke="#FFB800" stroke-width="1" stroke-dasharray="6 4" opacity="0.5"/>
  <text x="698" y="56" text-anchor="middle" fill="#FFB800" font-size="9" font-weight="bold" letter-spacing="1">x_max = 100</text>

  <!-- f(x)=1 horizontal marker -->
  <line x1="698" y1="60" x2="840" y2="60" stroke="#00D4FF" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
  <text x="835" y="55" text-anchor="end" fill="#00D4FF" font-size="9" font-weight="bold">f(x) = 1</text>

  <!-- Alpha=1 reference line (faint) -->
  <line x1="130" y1="420" x2="698" y2="60" stroke="#FF4757" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.15"/>
  <text x="380" y="260" fill="#FF4757" font-size="7" opacity="0.25" transform="rotate(-33 380 260)">α = 1 (LINEAR)</text>

  <!-- Main f(x) curve with α=3/4 -->
  <!-- x_px = 130 + x * (710/125), y_px = 420 - f * 360 -->
  <!-- Glow layer -->
  <path d="M130,420 L136,414 L142,409 L153,400 L165,391 L176,384 L199,370 L222,357 L244,346 L267,336 L289,326 L311,318 L334,309 L356,302 L378,294 L401,287 L423,280 L445,273 L468,267 L490,260 L512,254 L534,248 L556,243 L579,237 L601,231 L623,226 L646,221 L668,215 L698,60 L720,60 L742,60 L764,60 L786,60 L808,60 L840,60"
    fill="none" stroke="#FFB800" stroke-width="4" opacity="0.1" filter="url(#glow)"/>

  <!-- Main curve (animated draw-on) -->
  <path d="M130,420 L136,414 L142,409 L153,400 L165,391 L176,384 L199,370 L222,357 L244,346 L267,336 L289,326 L311,318 L334,309 L356,302 L378,294 L401,287 L423,280 L445,273 L468,267 L490,260 L512,254 L534,248 L556,243 L579,237 L601,231 L623,226 L646,221 L668,215 L698,60 L720,60 L742,60 L764,60 L786,60 L808,60 L840,60"
    fill="none" stroke="#FFB800" stroke-width="2" stroke-linecap="round" filter="url(#glow)"
    stroke-dasharray="1200" stroke-dashoffset="1200">
    <animate attributeName="stroke-dashoffset" from="1200" to="0" dur="2.5s" fill="freeze"/>
  </path>

  <!-- Data point traveling along curve -->
  <circle r="3" fill="#00D4FF" opacity="0">
    <animate attributeName="opacity" from="0" to="0.9" dur="0.3s" begin="2.5s" fill="freeze"/>
    <animateMotion dur="4s" repeatCount="indefinite" begin="2.5s"
      path="M130,420 L136,414 L142,409 L153,400 L165,391 L176,384 L199,370 L222,357 L244,346 L267,336 L289,326 L311,318 L334,309 L356,302 L378,294 L401,287 L423,280 L445,273 L468,267 L490,260 L512,254 L534,248 L556,243 L579,237 L601,231 L623,226 L646,221 L668,215 L698,60 L720,60 L840,60"/>
  </circle>

  <!-- Region labels (HUD panels) -->
  <!-- Rising region -->
  <g>
    <rect x="160" y="72" width="250" height="45" fill="#111827" stroke="#1E3A5F" stroke-width="1"/>
    <line x1="160" y1="72" x2="200" y2="72" stroke="#FFB800" stroke-width="1.5" opacity="0.6"/>
    <text x="170" y="88" fill="#FFB800" font-size="10" font-weight="bold" letter-spacing="1">f(x) = (x / x_max)^α</text>
    <text x="170" y="108" fill="#4A6080" font-size="8">α = 3/4 · x &lt; x_max</text>
  </g>
  <line x1="285" y1="120" x2="400" y2="280" stroke="#FFB800" stroke-width="0.5" opacity="0.15" stroke-dasharray="2 3"/>

  <!-- Plateau region -->
  <g>
    <rect x="720" y="72" width="120" height="45" fill="#111827" stroke="#1E3A5F" stroke-width="1"/>
    <line x1="840" y1="72" x2="800" y2="72" stroke="#00D4FF" stroke-width="1.5" opacity="0.6"/>
    <text x="730" y="88" fill="#00D4FF" font-size="10" font-weight="bold" letter-spacing="1">f(x) = 1</text>
    <text x="730" y="108" fill="#4A6080" font-size="8">x ≥ x_max</text>
  </g>
  <line x1="770" y1="120" x2="770" y2="56" stroke="#00D4FF" stroke-width="0.5" opacity="0.15" stroke-dasharray="2 3"/>

  <!-- Properties readout panel -->
  <g>
    <rect x="90" y="480" width="780" height="55" fill="#111827" stroke="#1E3A5F" stroke-width="1"/>
    <line x1="90" y1="480" x2="130" y2="480" stroke="#FFB800" stroke-width="1.5" opacity="0.5"/>
    <text x="100" y="498" fill="#8BA3C7" font-size="9" letter-spacing="1">PROPERTIES:</text>
    <!-- Property beacons -->
    <circle cx="195" cy="494" r="2" fill="#FFB800" opacity="0.8"/>
    <text x="205" y="498" fill="#E8F0FE" font-size="8">f(0) = 0 — RARE PAIRS ARE NOT OVERWEIGHTED</text>
    <circle cx="195" cy="514" r="2" fill="#00D4FF" opacity="0.8"/>
    <text x="205" y="518" fill="#E8F0FE" font-size="8">f(x) IS NON-DECREASING</text>
    <circle cx="560" cy="494" r="2" fill="#26DE81" opacity="0.8"/>
    <text x="570" y="498" fill="#E8F0FE" font-size="8">f(x) STAYS SMALL FOR LARGE x</text>
    <circle cx="560" cy="514" r="2" fill="#9F43FF" opacity="0.8"/>
    <text x="570" y="518" fill="#E8F0FE" font-size="8">α = 3/4 OUTPERFORMS α = 1 (PENNINGTON ET AL. 2014)</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="575" width="960" height="5" fill="#111827"/>
  <rect x="0" y="575" width="960" height="1" fill="#1E3A5F" opacity="0.5"/>
  <text x="20" y="572" fill="#4A6080" font-size="7">EMNLP 2014 · PENNINGTON, SOCHER &amp; MANNING</text>
  <text x="940" y="572" fill="#4A6080" font-size="7" text-anchor="end">WEIGHT_FUNC: X_MAX=100 · ALPHA=0.75</text>

  <!-- Subtle accretion disk line -->
  <line x1="0" y1="400" x2="960" y2="400" stroke="#FFB800" stroke-width="0.5" opacity="0.06"/>
</svg>