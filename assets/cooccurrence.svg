<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'Consolas','Courier New',monospace">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="580" fill="#0B1120"/>
  <g opacity="0.04" stroke="#1E3A5F" stroke-width="0.5">
    <line x1="96" y1="0" x2="96" y2="580"/><line x1="192" y1="0" x2="192" y2="580"/>
    <line x1="288" y1="0" x2="288" y2="580"/><line x1="384" y1="0" x2="384" y2="580"/>
    <line x1="480" y1="0" x2="480" y2="580"/><line x1="576" y1="0" x2="576" y2="580"/>
    <line x1="672" y1="0" x2="672" y2="580"/><line x1="768" y1="0" x2="768" y2="580"/>
    <line x1="864" y1="0" x2="864" y2="580"/>
  </g>

  <rect x="0" y="0" width="960" height="3" fill="#FFB800" opacity="0.6"/>
  <text x="20" y="22" fill="#FFB800" font-size="11" font-weight="bold" letter-spacing="3" opacity="0.9">CO-OCCURRENCE PIPELINE</text>
  <text x="940" y="22" fill="#4A6080" font-size="9" text-anchor="end">SYS://DATA/COOCCURRENCE</text>
  <circle cx="880" cy="17" r="3" fill="#FFB800" opacity="0.8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- === STAGE 1: CORPUS === -->
  <g>
    <rect x="30" y="55" width="150" height="150" fill="#111827" stroke="#1E3A5F" stroke-width="1"/>
    <line x1="30" y1="55" x2="70" y2="55" stroke="#FFB800" stroke-width="1.5" opacity="0.6"/>
    <line x1="30" y1="55" x2="30" y2="95" stroke="#FFB800" stroke-width="1.5" opacity="0.6"/>
    <text x="40" y="75" fill="#FFB800" font-size="9" font-weight="bold" letter-spacing="1">CORPUS</text>
    <text x="40" y="90" fill="#4A6080" font-size="7">WIKIPEDIA DUMP</text>
    <!-- File lines -->
    <g opacity="0.2" fill="#8BA3C7" font-size="6">
      <text x="40" y="110">the quick brown fox</text>
      <text x="40" y="122">jumps over the lazy</text>
      <text x="40" y="134">dog and the cat sat</text>
      <text x="40" y="146">on the mat while the</text>
      <text x="40" y="158">fox ran through the</text>
      <text x="40" y="170">field near the house</text>
      <text x="40" y="182">where the dog slept</text>
    </g>
    <text x="105" y="198" fill="#4A6080" font-size="7" text-anchor="middle">~1.6B TOKENS</text>
  </g>

  <!-- Arrow 1→2 -->
  <line x1="182" y1="130" x2="218" y2="130" stroke="#FFB800" stroke-width="1" opacity="0.4"/>
  <circle r="2" fill="#FFB800" opacity="0.7">
    <animateMotion dur="1.5s" repeatCount="indefinite" path="M182,130 L218,130"/>
  </circle>

  <!-- === STAGE 2: TOKENIZE === -->
  <g>
    <rect x="220" y="55" width="150" height="150" fill="#111827" stroke="#1E3A5F" stroke-width="1"/>
    <line x1="220" y1="55" x2="260" y2="55" stroke="#00D4FF" stroke-width="1.5" opacity="0.6"/>
    <line x1="220" y1="55" x2="220" y2="95" stroke="#00D4FF" stroke-width="1.5" opacity="0.6"/>
    <text x="230" y="75" fill="#00D4FF" font-size="9" font-weight="bold" letter-spacing="1">TOKENIZE</text>
    <text x="230" y="90" fill="#4A6080" font-size="7">data.tokenizer</text>
    <!-- Token visualization -->
    <g font-size="7">
      <rect x="230" y="105" width="28" height="16" fill="#1A2535" stroke="#00D4FF" stroke-width="0.5" opacity="0.5"/>
      <text x="244" y="116" text-anchor="middle" fill="#00D4FF" font-size="7" opacity="0.8">the</text>
      <rect x="262" y="105" width="36" height="16" fill="#1A2535" stroke="#00D4FF" stroke-width="0.5" opacity="0.5"/>
      <text x="280" y="116" text-anchor="middle" fill="#00D4FF" font-size="7" opacity="0.8">quick</text>
      <rect x="302" y="105" width="36" height="16" fill="#1A2535" stroke="#00D4FF" stroke-width="0.5" opacity="0.5"/>
      <text x="320" y="116" text-anchor="middle" fill="#00D4FF" font-size="7" opacity="0.8">brown</text>
      <rect x="230" y="125" width="26" height="16" fill="#1A2535" stroke="#00D4FF" stroke-width="0.5" opacity="0.5"/>
      <text x="243" y="136" text-anchor="middle" fill="#00D4FF" font-size="7" opacity="0.8">fox</text>
      <rect x="260" y="125" width="34" height="16" fill="#1A2535" stroke="#00D4FF" stroke-width="0.5" opacity="0.5"/>
      <text x="277" y="136" text-anchor="middle" fill="#00D4FF" font-size="7" opacity="0.8">jumps</text>
    </g>
    <text x="295" y="198" fill="#4A6080" font-size="7" text-anchor="middle">LOWERCASE + SPLIT</text>
  </g>

  <!-- Arrow 2→3 -->
  <line x1="372" y1="130" x2="408" y2="130" stroke="#00D4FF" stroke-width="1" opacity="0.4"/>
  <circle r="2" fill="#00D4FF" opacity="0.7">
    <animateMotion dur="1.5s" repeatCount="indefinite" path="M372,130 L408,130" begin="0.3s"/>
  </circle>

  <!-- === STAGE 3: VOCABULARY === -->
  <g>
    <rect x="410" y="55" width="150" height="150" fill="#111827" stroke="#1E3A5F" stroke-width="1"/>
    <line x1="410" y1="55" x2="450" y2="55" stroke="#26DE81" stroke-width="1.5" opacity="0.6"/>
    <line x1="410" y1="55" x2="410" y2="95" stroke="#26DE81" stroke-width="1.5" opacity="0.6"/>
    <text x="420" y="75" fill="#26DE81" font-size="9" font-weight="bold" letter-spacing="1">VOCABULARY</text>
    <text x="420" y="90" fill="#4A6080" font-size="7">data.vocabulary</text>
    <!-- Frequency table -->
    <g font-size="7" fill="#8BA3C7">
      <text x="420" y="110"><tspan fill="#26DE81" font-weight="bold">0</tspan> the · 2.3M</text>
      <text x="420" y="122"><tspan fill="#26DE81" font-weight="bold">1</tspan> of · 1.8M</text>
      <text x="420" y="134"><tspan fill="#26DE81" font-weight="bold">2</tspan> and · 1.5M</text>
      <text x="420" y="146"><tspan fill="#26DE81" font-weight="bold">3</tspan> to · 1.2M</text>
      <text x="420" y="158"><tspan fill="#26DE81" font-weight="bold">4</tspan> a · 1.1M</text>
      <text x="520" y="110" fill="#4A6080">...</text>
      <text x="520" y="122" fill="#4A6080">...</text>
    </g>
    <text x="485" y="198" fill="#4A6080" font-size="7" text-anchor="middle">TOP 400K WORDS</text>
  </g>

  <!-- Arrow 3→4 -->
  <line x1="562" y1="130" x2="598" y2="130" stroke="#26DE81" stroke-width="1" opacity="0.4"/>
  <circle r="2" fill="#26DE81" opacity="0.7">
    <animateMotion dur="1.5s" repeatCount="indefinite" path="M562,130 L598,130" begin="0.6s"/>
  </circle>

  <!-- === STAGE 4: CO-OCCURRENCE MATRIX === -->
  <g>
    <rect x="600" y="55" width="170" height="150" fill="#111827" stroke="#1E3A5F" stroke-width="1"/>
    <line x1="600" y1="55" x2="640" y2="55" stroke="#9F43FF" stroke-width="1.5" opacity="0.6"/>
    <line x1="600" y1="55" x2="600" y2="95" stroke="#9F43FF" stroke-width="1.5" opacity="0.6"/>
    <text x="610" y="75" fill="#9F43FF" font-size="9" font-weight="bold" letter-spacing="1">MATRIX X</text>
    <text x="610" y="90" fill="#4A6080" font-size="7">data.cooccurrence</text>
    <!-- Matrix heatmap visualization -->
    <g>
      <!-- Row/col headers -->
      <text x="648" y="112" fill="#4A6080" font-size="6">the</text>
      <text x="678" y="112" fill="#4A6080" font-size="6">of</text>
      <text x="708" y="112" fill="#4A6080" font-size="6">and</text>
      <text x="635" y="128" fill="#4A6080" font-size="6">the</text>
      <text x="635" y="144" fill="#4A6080" font-size="6">of</text>
      <text x="635" y="160" fill="#4A6080" font-size="6">and</text>
      <!-- Heatmap cells -->
      <rect x="643" y="117" width="22" height="13" fill="#9F43FF" opacity="0.1"/>
      <rect x="673" y="117" width="22" height="13" fill="#9F43FF" opacity="0.4"/>
      <rect x="703" y="117" width="22" height="13" fill="#9F43FF" opacity="0.2"/>
      <rect x="643" y="133" width="22" height="13" fill="#9F43FF" opacity="0.3"/>
      <rect x="673" y="133" width="22" height="13" fill="#9F43FF" opacity="0.1"/>
      <rect x="703" y="133" width="22" height="13" fill="#9F43FF" opacity="0.3"/>
      <rect x="643" y="149" width="22" height="13" fill="#9F43FF" opacity="0.2"/>
      <rect x="673" y="149" width="22" height="13" fill="#9F43FF" opacity="0.3"/>
      <rect x="703" y="149" width="22" height="13" fill="#9F43FF" opacity="0.1"/>
    </g>
    <text x="685" y="198" fill="#4A6080" font-size="7" text-anchor="middle">X_ij: COUNT(i,j)</text>
  </g>

  <!-- Arrow 4→5 -->
  <line x1="772" y1="130" x2="808" y2="130" stroke="#9F43FF" stroke-width="1" opacity="0.4"/>
  <circle r="2" fill="#9F43FF" opacity="0.7">
    <animateMotion dur="1.5s" repeatCount="indefinite" path="M772,130 L808,130" begin="0.9s"/>
  </circle>

  <!-- === STAGE 5: TRIPLETS === -->
  <g>
    <rect x="810" y="55" width="120" height="150" fill="#111827" stroke="#1E3A5F" stroke-width="1"/>
    <line x1="930" y1="55" x2="890" y2="55" stroke="#FFB800" stroke-width="1.5" opacity="0.6"/>
    <line x1="930" y1="55" x2="930" y2="95" stroke="#FFB800" stroke-width="1.5" opacity="0.6"/>
    <text x="820" y="75" fill="#FFB800" font-size="9" font-weight="bold" letter-spacing="1">TRIPLETS</text>
    <text x="820" y="90" fill="#4A6080" font-size="7">rows,cols,vals</text>
    <g font-size="7" fill="#8BA3C7">
      <text x="820" y="110"><tspan fill="#FFB800">i</tspan>=0 <tspan fill="#00D4FF">j</tspan>=3 <tspan fill="#26DE81">v</tspan>=2.41</text>
      <text x="820" y="122"><tspan fill="#FFB800">i</tspan>=0 <tspan fill="#00D4FF">j</tspan>=7 <tspan fill="#26DE81">v</tspan>=1.83</text>
      <text x="820" y="134"><tspan fill="#FFB800">i</tspan>=1 <tspan fill="#00D4FF">j</tspan>=0 <tspan fill="#26DE81">v</tspan>=3.17</text>
      <text x="820" y="146"><tspan fill="#FFB800">i</tspan>=2 <tspan fill="#00D4FF">j</tspan>=5 <tspan fill="#26DE81">v</tspan>=0.92</text>
    </g>
    <text x="870" y="198" fill="#4A6080" font-size="7" text-anchor="middle">NONZERO ENTRIES</text>
  </g>

  <!-- === DETAIL PANEL: WINDOW + DISTANCE WEIGHTING === -->
  <g>
    <rect x="30" y="240" width="430" height="200" fill="#111827" stroke="#1E3A5F" stroke-width="1"/>
    <line x1="30" y1="240" x2="70" y2="240" stroke="#FFB800" stroke-width="1.5" opacity="0.6"/>
    <text x="40" y="260" fill="#FFB800" font-size="10" font-weight="bold" letter-spacing="1">CONTEXT WINDOW</text>
    <text x="300" y="260" fill="#4A6080" font-size="8">SYMMETRIC · WINDOW=10</text>

    <!-- Token sequence visualization -->
    <g font-size="8">
      <text x="45" y="290" fill="#4A6080" font-size="7">TARGET</text>
      <!-- Target word -->
      <rect x="195" y="278" width="50" height="18" fill="#FFB800" opacity="0.15" stroke="#FFB800" stroke-width="0.5"/>
      <text x="220" y="291" text-anchor="middle" fill="#FFB800" font-weight="bold" font-size="8">house</text>
      <!-- Context words left -->
      <rect x="45" y="278" width="28" height="18" fill="#1A2535" stroke="#00D4FF" stroke-width="0.5" opacity="0.4"/>
      <text x="59" y="291" text-anchor="middle" fill="#00D4FF" font-size="7" opacity="0.7">the</text>
      <rect x="77" y="278" width="36" height="18" fill="#1A2535" stroke="#00D4FF" stroke-width="0.5" opacity="0.5"/>
      <text x="95" y="291" text-anchor="middle" fill="#00D4FF" font-size="7" opacity="0.8">quick</text>
      <rect x="117" y="278" width="34" height="18" fill="#1A2535" stroke="#00D4FF" stroke-width="0.5" opacity="0.6"/>
      <text x="134" y="291" text-anchor="middle" fill="#00D4FF" font-size="7" opacity="0.8">brown</text>
      <rect x="155" y="278" width="36" height="18" fill="#1A2535" stroke="#00D4FF" stroke-width="0.5" opacity="0.7"/>
      <text x="173" y="291" text-anchor="middle" fill="#00D4FF" font-size="7" opacity="0.9">fox</text>
      <!-- Context words right -->
      <rect x="249" y="278" width="40" height="18" fill="#1A2535" stroke="#00D4FF" stroke-width="0.5" opacity="0.7"/>
      <text x="269" y="291" text-anchor="middle" fill="#00D4FF" font-size="7" opacity="0.9">stood</text>
      <rect x="293" y="278" width="28" height="18" fill="#1A2535" stroke="#00D4FF" stroke-width="0.5" opacity="0.6"/>
      <text x="307" y="291" text-anchor="middle" fill="#00D4FF" font-size="7" opacity="0.8">by</text>
      <rect x="325" y="278" width="28" height="18" fill="#1A2535" stroke="#00D4FF" stroke-width="0.5" opacity="0.5"/>
      <text x="339" y="291" text-anchor="middle" fill="#00D4FF" font-size="7" opacity="0.7">the</text>
      <rect x="357" y="278" width="28" height="18" fill="#1A2535" stroke="#00D4FF" stroke-width="0.5" opacity="0.4"/>
      <text x="371" y="291" text-anchor="middle" fill="#00D4FF" font-size="7" opacity="0.6">old</text>
    </g>

    <!-- Distance weighting formula -->
    <text x="40" y="325" fill="#E8F0FE" font-size="10" letter-spacing="0.5">CONTRIBUTION = 1/d</text>
    <text x="40" y="345" fill="#4A6080" font-size="8">d = DISTANCE IN TOKENS BETWEEN TARGET AND CONTEXT</text>

    <!-- Distance table -->
    <g font-size="8" fill="#8BA3C7">
      <text x="40" y="370" fill="#4A6080" font-size="7">DISTANCE</text>
      <text x="120" y="370" fill="#4A6080" font-size="7">CONTRIBUTION</text>
      <text x="40" y="386"><tspan fill="#00D4FF">d=1</tspan>  →  1.00</text>
      <text x="40" y="400"><tspan fill="#00D4FF">d=2</tspan>  →  0.50</text>
      <text x="40" y="414"><tspan fill="#00D4FF">d=3</tspan>  →  0.33</text>
      <text x="40" y="428"><tspan fill="#00D4FF">d=5</tspan>  →  0.20</text>
      <text x="40" y="442"><tspan fill="#00D4FF">d=10</tspan> →  0.10</text>
    </g>

    <!-- Bar chart of contributions -->
    <g transform="translate(220,355)" opacity="0.5">
      <rect x="0" y="0" width="100" height="8" fill="#00D4FF" opacity="0.6"/>
      <text x="105" y="7" fill="#4A6080" font-size="6">d=1</text>
      <rect x="0" y="14" width="50" height="8" fill="#00D4FF" opacity="0.45"/>
      <text x="55" y="21" fill="#4A6080" font-size="6">d=2</text>
      <rect x="0" y="28" width="33" height="8" fill="#00D4FF" opacity="0.35"/>
      <text x="38" y="35" fill="#4A6080" font-size="6">d=3</text>
      <rect x="0" y="42" width="20" height="8" fill="#00D4FF" opacity="0.25"/>
      <text x="25" y="49" fill="#4A6080" font-size="6">d=5</text>
      <rect x="0" y="56" width="10" height="8" fill="#00D4FF" opacity="0.15"/>
      <text x="15" y="63" fill="#4A6080" font-size="6">d=10</text>
    </g>
  </g>

  <!-- === DETAIL PANEL: MATRIX CONSTRUCTION === -->
  <g>
    <rect x="500" y="240" width="430" height="200" fill="#111827" stroke="#1E3A5F" stroke-width="1"/>
    <line x1="930" y1="240" x2="890" y2="240" stroke="#9F43FF" stroke-width="1.5" opacity="0.6"/>
    <text x="510" y="260" fill="#9F43FF" font-size="10" font-weight="bold" letter-spacing="1">CO-OCCURRENCE ACCUMULATION</text>

    <!-- Step by step -->
    <g font-size="8" fill="#8BA3C7">
      <text x="510" y="285" fill="#E8F0FE" font-size="9">FOR EACH TARGET WORD i:</text>
      <text x="530" y="305">1. SCAN WINDOW OF SIZE 10 ON EACH SIDE</text>
      <text x="530" y="320">2. FOR EACH CONTEXT WORD j AT DISTANCE d:</text>
      <text x="550" y="335" fill="#9F43FF" font-weight="bold">X[i][j] += 1.0 / d</text>
      <text x="530" y="355">3. STORE ONLY NONZERO ENTRIES</text>
    </g>

    <!-- Accumulation animation -->
    <g>
      <text x="510" y="390" fill="#4A6080" font-size="7">LIVE ACCUMULATION:</text>
      <text x="510" y="410" fill="#9F43FF" font-size="9" font-weight="bold">
        X[the][house]
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
      </text>
      <text x="640" y="410" fill="#8BA3C7" font-size="9">+= 0.10</text>
      <text x="510" y="428" fill="#9F43FF" font-size="9" font-weight="bold">
        X[fox][house]
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
      </text>
      <text x="640" y="428" fill="#8BA3C7" font-size="9">+= 0.33</text>
    </g>

    <!-- Context type toggle -->
    <g>
      <rect x="780" y="380" width="130" height="50" fill="#1A2535" stroke="#1E3A5F" stroke-width="1"/>
      <text x="790" y="398" fill="#4A6080" font-size="7">CONTEXT TYPE:</text>
      <text x="790" y="418" fill="#FFB800" font-size="9" font-weight="bold">SYMMETRIC</text>
      <text x="870" y="418" fill="#4A6080" font-size="7">/ ASYMMETRIC</text>
    </g>
  </g>

  <!-- Data flow bar at bottom -->
  <g>
    <rect x="30" y="470" width="900" height="50" fill="#111827" stroke="#1E3A5F" stroke-width="1"/>
    <line x1="30" y1="470" x2="70" y2="470" stroke="#FFB800" stroke-width="1.5" opacity="0.5"/>
    <text x="40" y="490" fill="#8BA3C7" font-size="8" letter-spacing="1">DATA FLOW:</text>
    <text x="130" y="490" fill="#FFB800" font-size="8">CORPUS</text>
    <text x="185" y="490" fill="#4A6080" font-size="8">→</text>
    <text x="200" y="490" fill="#00D4FF" font-size="8">TOKENIZE</text>
    <text x="265" y="490" fill="#4A6080" font-size="8">→</text>
    <text x="280" y="490" fill="#26DE81" font-size="8">VOCABULARY</text>
    <text x="365" y="490" fill="#4A6080" font-size="8">→</text>
    <text x="380" y="490" fill="#9F43FF" font-size="8">MATRIX X</text>
    <text x="445" y="490" fill="#4A6080" font-size="8">→</text>
    <text x="460" y="490" fill="#FFB800" font-size="8">TRIPLETS (rows, cols, vals)</text>

    <!-- Progress bar animation -->
    <rect x="130" y="500" width="400" height="3" fill="#1A2535"/>
    <rect x="130" y="500" width="0" height="3" fill="#FFB800" opacity="0.6">
      <animate attributeName="width" values="0;400;0" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0" y="575" width="960" height="5" fill="#111827"/>
  <rect x="0" y="575" width="960" height="1" fill="#1E3A5F" opacity="0.5"/>
  <text x="20" y="572" fill="#4A6080" font-size="7">EMNLP 2014 · PENNINGTON, SOCHER &amp; MANNING</text>
  <text x="940" y="572" fill="#4A6080" font-size="7" text-anchor="end">WINDOW=10 · SYMMETRIC · 1/d WEIGHTING</text>
</svg>