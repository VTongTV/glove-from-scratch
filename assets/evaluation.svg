<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'Consolas','Courier New',monospace">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="580" fill="#0B1120"/>
  <g opacity="0.04" stroke="#1E3A5F" stroke-width="0.5">
    <line x1="96" y1="0" x2="96" y2="580"/><line x1="192" y1="0" x2="192" y2="580"/>
    <line x1="288" y1="0" x2="288" y2="580"/><line x1="384" y1="0" x2="384" y2="580"/>
    <line x1="480" y1="0" x2="480" y2="580"/><line x1="576" y1="0" x2="576" y2="580"/>
    <line x1="672" y1="0" x2="672" y2="580"/><line x1="768" y1="0" x2="768" y2="580"/>
    <line x1="864" y1="0" x2="864" y2="580"/>
  </g>

  <rect x="0" y="0" width="960" height="3" fill="#FFB800" opacity="0.6"/>
  <text x="20" y="22" fill="#FFB800" font-size="11" font-weight="bold" letter-spacing="3" opacity="0.9">EVALUATION PIPELINE</text>
  <text x="940" y="22" fill="#4A6080" font-size="9" text-anchor="end">SYS://EVAL</text>
  <circle cx="880" cy="17" r="3" fill="#FFB800" opacity="0.8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- === WORD ANALOGY SECTION === -->
  <g>
    <rect x="30" y="45" width="440" height="290" fill="#111827" stroke="#1E3A5F" stroke-width="1"/>
    <line x1="30" y1="45" x2="70" y2="45" stroke="#FFB800" stroke-width="1.5" opacity="0.6"/>
    <text x="40" y="65" fill="#FFB800" font-size="11" font-weight="bold" letter-spacing="1">WORD ANALOGY TASK</text>
    <text x="300" y="65" fill="#4A6080" font-size="7">eval.analogy · 19,544 QUESTIONS</text>

    <!-- Analogy formula -->
    <text x="50" y="90" fill="#E8F0FE" font-size="10" letter-spacing="0.5">a is to b as c is to ?</text>
    <text x="50" y="112" fill="#00D4FF" font-size="12" font-weight="bold" letter-spacing="1">v(d) = v(b) − v(a) + v(c)</text>
    <text x="50" y="132" fill="#4A6080" font-size="8">FIND CLOSEST WORD BY COSINE SIMILARITY</text>

    <!-- Example -->
    <g>
      <rect x="50" y="145" width="400" height="65" fill="#1A2535" stroke="#1E3A5F" stroke-width="1"/>
      <text x="60" y="163" fill="#4A6080" font-size="7">EXAMPLE:</text>
      <text x="60" y="182" fill="#FFB800" font-size="10" font-weight="bold">king</text>
      <text x="90" y="182" fill="#4A6080" font-size="10">−</text>
      <text x="105" y="182" fill="#FFB800" font-size="10" font-weight="bold">man</text>
      <text x="135" y="182" fill="#4A6080" font-size="10">+</text>
      <text x="150" y="182" fill="#FFB800" font-size="10" font-weight="bold">woman</text>
      <text x="195" y="182" fill="#4A6080" font-size="10">=</text>
      <text x="215" y="182" fill="#26DE81" font-size="10" font-weight="bold">queen</text>
      <text x="260" y="182" fill="#26DE81" font-size="8">✓ CORRECT</text>
    </g>

    <!-- Semantic vs Syntactic -->
    <g>
      <rect x="50" y="220" width="190" height="90" fill="#1A2535" stroke="#1E3A5F" stroke-width="1"/>
      <text x="60" y="240" fill="#9F43FF" font-size="9" font-weight="bold" letter-spacing="1">SEMANTIC</text>
      <text x="60" y="258" fill="#8BA3C7" font-size="7">capital-common-countries</text>
      <text x="60" y="270" fill="#8BA3C7" font-size="7">capital-world</text>
      <text x="60" y="282" fill="#8BA3C7" font-size="7">currency</text>
      <text x="60" y="294" fill="#4A6080" font-size="7">city-in-state ...</text>
    </g>
    <g>
      <rect x="255" y="220" width="190" height="90" fill="#1A2535" stroke="#1E3A5F" stroke-width="1"/>
      <text x="265" y="240" fill="#00D4FF" font-size="9" font-weight="bold" letter-spacing="1">SYNTACTIC</text>
      <text x="265" y="258" fill="#8BA3C7" font-size="7">gram1-adjective-to-adverb</text>
      <text x="265" y="270" fill="#8BA3C7" font-size="7">gram2-opposite</text>
      <text x="265" y="282" fill="#8BA3C7" font-size="7">gram3-comparative</text>
      <text x="265" y="294" fill="#4A6080" font-size="7">gram4-superlative ...</text>
    </g>

    <!-- Paper benchmarks -->
    <text x="50" y="328" fill="#4A6080" font-size="7">PAPER BENCHMARK (GLOVE 300D, 6B):</text>
    <text x="50" y="340" fill="#FFB800" font-size="8">SEMANTIC: 77.4% · SYNTACTIC: 67.0% · TOTAL: 71.7%</text>
  </g>

  <!-- === WORD SIMILARITY SECTION === -->
  <g>
    <rect x="490" y="45" width="440" height="290" fill="#111827" stroke="#1E3A5F" stroke-width="1"/>
    <line x1="930" y1="45" x2="890" y2="45" stroke="#00D4FF" stroke-width="1.5" opacity="0.6"/>
    <text x="500" y="65" fill="#00D4FF" font-size="11" font-weight="bold" letter-spacing="1">WORD SIMILARITY TASK</text>
    <text x="770" y="65" fill="#4A6080" font-size="7">eval.similarity · 5 DATASETS</text>

    <!-- Method -->
    <text x="510" y="90" fill="#E8F0FE" font-size="9">1. NORMALIZE EACH FEATURE ACROSS VOCABULARY</text>
    <text x="510" y="108" fill="#E8F0FE" font-size="9">2. COMPUTE COSINE SIMILARITY FOR WORD PAIRS</text>
    <text x="510" y="126" fill="#E8F0FE" font-size="9">3. REPORT SPEARMAN RANK CORRELATION</text>

    <!-- Dataset cards -->
    <g>
      <rect x="510" y="142" width="80" height="40" fill="#1A2535" stroke="#1E3A5F" stroke-width="1"/>
      <text x="520" y="158" fill="#9F43FF" font-size="9" font-weight="bold">WS353</text>
      <text x="520" y="172" fill="#FFB800" font-size="8">65.8</text>
    </g>
    <g>
      <rect x="600" y="142" width="60" height="40" fill="#1A2535" stroke="#1E3A5F" stroke-width="1"/>
      <text x="610" y="158" fill="#9F43FF" font-size="9" font-weight="bold">MC</text>
      <text x="610" y="172" fill="#FFB800" font-size="8">72.7</text>
    </g>
    <g>
      <rect x="670" y="142" width="60" height="40" fill="#1A2535" stroke="#1E3A5F" stroke-width="1"/>
      <text x="680" y="158" fill="#9F43FF" font-size="9" font-weight="bold">RG</text>
      <text x="680" y="172" fill="#FFB800" font-size="8">77.8</text>
    </g>
    <g>
      <rect x="740" y="142" width="70" height="40" fill="#1A2535" stroke="#1E3A5F" stroke-width="1"/>
      <text x="750" y="158" fill="#9F43FF" font-size="9" font-weight="bold">SCWS</text>
      <text x="750" y="172" fill="#FFB800" font-size="8">53.9</text>
    </g>
    <g>
      <rect x="820" y="142" width="60" height="40" fill="#1A2535" stroke="#1E3A5F" stroke-width="1"/>
      <text x="830" y="158" fill="#9F43FF" font-size="9" font-weight="bold">RW</text>
      <text x="830" y="172" fill="#FFB800" font-size="8">38.1</text>
    </g>

    <!-- Similarity bar chart -->
    <text x="510" y="200" fill="#4A6080" font-size="7">SPEARMAN ρ — PAPER BENCHMARKS (GLOVE 300D, 6B)</text>
    <g transform="translate(510,210)" opacity="0.5">
      <rect x="0" y="0" width="78" height="12" fill="#9F43FF" opacity="0.4"/><text x="82" y="10" fill="#8BA3C7" font-size="6">WS353</text>
      <rect x="0" y="18" width="73" height="12" fill="#9F43FF" opacity="0.35"/><text x="77" y="28" fill="#8BA3C7" font-size="6">MC</text>
      <rect x="0" y="36" width="78" height="12" fill="#9F43FF" opacity="0.45"/><text x="82" y="46" fill="#8BA3C7" font-size="6">RG</text>
      <rect x="0" y="54" width="54" height="12" fill="#9F43FF" opacity="0.3"/><text x="58" y="64" fill="#8BA3C7" font-size="6">SCWS</text>
      <rect x="0" y="72" width="38" height="12" fill="#9F43FF" opacity="0.2"/><text x="42" y="82" fill="#8BA3C7" font-size="6">RW</text>
    </g>
    <text x="510" y="328" fill="#4A6080" font-size="7">SCALE: 0-100 (ρ × 100)</text>
  </g>

  <!-- === SHARED: COSINE SIMILARITY PANEL === -->
  <g>
    <rect x="30" y="350" width="900" height="120" fill="#111827" stroke="#1E3A5F" stroke-width="1"/>
    <line x1="30" y1="350" x2="70" y2="350" stroke="#FFB800" stroke-width="1.5" opacity="0.5"/>
    <text x="40" y="370" fill="#FFB800" font-size="10" font-weight="bold" letter-spacing="1">COSINE SIMILARITY — SHARED METRIC</text>

    <!-- Formula -->
    <text x="50" y="395" fill="#E8F0FE" font-size="11">cos(a, b) = (a · b) / (‖a‖ × ‖b‖)</text>
    <text x="50" y="415" fill="#4A6080" font-size="8">RANGE: [-1, 1] · 1 = IDENTICAL DIRECTION · 0 = ORTHOGONAL · -1 = OPPOSITE</text>

    <!-- Vector visualization -->
    <g transform="translate(500,380)">
      <!-- Vector a -->
      <line x1="0" y1="30" x2="80" y2="0" stroke="#FFB800" stroke-width="2" opacity="0.7"/>
      <circle cx="80" cy="0" r="3" fill="#FFB800" opacity="0.8"/>
      <text x="85" y="3" fill="#FFB800" font-size="8" font-weight="bold">v(a)</text>
      <!-- Vector b -->
      <line x1="0" y1="30" x2="60" y2="-20" stroke="#00D4FF" stroke-width="2" opacity="0.7"/>
      <circle cx="60" cy="-20" r="3" fill="#00D4FF" opacity="0.8"/>
      <text x="65" y="-17" fill="#00D4FF" font-size="8" font-weight="bold">v(b)</text>
      <!-- Angle arc -->
      <path d="M25,22 Q30,12 35,18" fill="none" stroke="#9F43FF" stroke-width="1" opacity="0.5"/>
      <text x="38" y="14" fill="#9F43FF" font-size="7">θ</text>
    </g>

    <!-- Discard rule for analogy -->
    <g>
      <rect x="720" y="360" width="200" height="55" fill="#1A2535" stroke="#FF4757" stroke-width="1" opacity="0.7"/>
      <text x="730" y="378" fill="#FF4757" font-size="8" font-weight="bold" letter-spacing="1">ANALOGY RULE</text>
      <text x="730" y="395" fill="#8BA3C7" font-size="7">DISCARD INPUT WORDS {a,b,c}</text>
      <text x="730" y="407" fill="#8BA3C7" font-size="7">FROM CANDIDATE SET</text>
    </g>

    <!-- Exact match rule -->
    <g>
      <rect x="720" y="420" width="200" height="40" fill="#1A2535" stroke="#26DE81" stroke-width="1" opacity="0.7"/>
      <text x="730" y="438" fill="#26DE81" font-size="8" font-weight="bold" letter-spacing="1">SCORING</text>
      <text x="730" y="452" fill="#8BA3C7" font-size="7">EXACT MATCH ONLY · SYNONYMS = WRONG</text>
    </g>
  </g>

  <!-- Bottom status -->
  <g>
    <rect x="30" y="490" width="900" height="45" fill="#111827" stroke="#1E3A5F" stroke-width="1"/>
    <line x1="30" y1="490" x2="70" y2="490" stroke="#FFB800" stroke-width="1.5" opacity="0.4"/>
    <text x="40" y="510" fill="#8BA3C7" font-size="8" letter-spacing="1">EVAL FLOW:</text>
    <text x="120" y="510" fill="#FFB800" font-size="8">VECTORS</text>
    <text x="175" y="510" fill="#4A6080" font-size="8">→</text>
    <text x="190" y="510" fill="#00D4FF" font-size="8">NORMALIZE</text>
    <text x="265" y="510" fill="#4A6080" font-size="8">→</text>
    <text x="280" y="510" fill="#9F43FF" font-size="8">COSINE SIM</text>
    <text x="360" y="510" fill="#4A6080" font-size="8">→</text>
    <text x="375" y="510" fill="#26DE81" font-size="8">NEAREST NEIGHBOR</text>
    <text x="490" y="510" fill="#4A6080" font-size="8">→</text>
    <text x="505" y="510" fill="#FFB800" font-size="8">ACCURACY / ρ</text>

    <rect x="120" y="518" width="470" height="2" fill="#1A2535"/>
    <rect x="120" y="518" width="0" height="2" fill="#FFB800" opacity="0.5">
      <animate attributeName="width" values="0;470;0" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0" y="575" width="960" height="5" fill="#111827"/>
  <rect x="0" y="575" width="960" height="1" fill="#1E3A5F" opacity="0.5"/>
  <text x="20" y="572" fill="#4A6080" font-size="7">EMNLP 2014 · PENNINGTON, SOCHER &amp; MANNING</text>
  <text x="940" y="572" fill="#4A6080" font-size="7" text-anchor="end">ANALOGY: 19544 Qs · SIMILARITY: 5 DATASETS · COSINE</text>
</svg>